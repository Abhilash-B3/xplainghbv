services:
  postgres:
    image: postgres:16-alpine
    container_name: xplain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-xplainghbv_db}
    ports:
      - "5432:5432"
    volumes:
      - xplain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xplainghbv_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xplain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - xplain_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  xplain_postgres_data:
    name: xplain_postgres_data
  xplain_redis_data:
    name: xplain_redis_data
